name: Keep Supabase Active

on:
  schedule:
    # Runs at 00:00 UTC every Sunday (once a week)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows manual trigger

jobs:
  keep-active:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function to keep project active
        run: |
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"_honeypot": "ping"}' \
            https://bnfgzpzdfwoltyqpftvi.supabase.co/functions/v1/make-server-a85c355c/contact
